apiVersion: 1
datasources:
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    isDefault: true
    jsonData:
      host: clickhouse          # plugin v4
      server: clickhouse        # plugin v3 (на всякий случай)
      port: 8123
      protocol: http
      username: app
      defaultDatabase: cinema
    secureJsonData:
      password: app
