name: soa-hw5

x-kafka-common: &kafka-common
  image: apache/kafka:3.8.1
  restart: unless-stopped

x-kafka-env: &kafka-env
  CLUSTER_ID: "Mk3OEYBSD34fcwNTJENDM2Qk"
  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-controller:9093"
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_PROCESS_ROLES: broker
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_DEFAULT_REPLICATION_FACTOR: 2
  KAFKA_MIN_INSYNC_REPLICAS: 1
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
  KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"

services:
  # ------------------------------------------------------------------ Kafka (KRaft): 1 controller + 2 брокера
  kafka-controller:
    <<: *kafka-common
    environment:
      CLUSTER_ID: "Mk3OEYBSD34fcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-controller:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
      KAFKA_LOG_DIRS: /tmp/kraft-controller-logs
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms128m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-metadata-quorum.sh --bootstrap-controller localhost:9093 describe --status | grep -q LeaderId"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  kafka-1:
    <<: *kafka-common
    depends_on:
      kafka-controller: {condition: service_healthy}
    ports: ["29092:29092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:29092
    healthcheck: &broker-health
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 20s

  kafka-2:
    <<: *kafka-common
    depends_on:
      kafka-controller: {condition: service_healthy}
    ports: ["29093:29093"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,EXTERNAL://localhost:29093
    healthcheck: *broker-health

  # Создание топика: 3 партиции, RF=2, min.insync.replicas=1 (идемпотентно)
  kafka-init:
    image: apache/kafka:3.8.1
    depends_on:
      kafka-1: {condition: service_healthy}
      kafka-2: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092,kafka-2:9092 --create --if-not-exists \
          --topic movie-events --partitions 3 --replication-factor 2 \
          --config min.insync.replicas=1 --config retention.ms=604800000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --describe --topic movie-events
    restart: "no"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    depends_on:
      kafka-init: {condition: service_completed_successfully}
    ports: ["8081:8081"]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka-1:9092,PLAINTEXT://kafka-2:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 2
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xmx256m"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  # ------------------------------------------------------------------ Producer
  movie-service:
    build: ./producer
    depends_on:
      schema-registry: {condition: service_healthy}
    ports: ["8000:8000"]
    environment:
      KAFKA_BOOTSTRAP: kafka-1:9092,kafka-2:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      GENERATOR_ENABLED: "true"
      GENERATOR_BACKFILL_DAYS: "10"
      GENERATOR_NEW_USERS_PER_DAY: "40"
      GENERATOR_SESSIONS_PER_SEC: "1"
    healthcheck: &py-health
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # ------------------------------------------------------------------ ClickHouse
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    depends_on:
      schema-registry: {condition: service_healthy}
    ports: ["8123:8123"]
    environment:
      CLICKHOUSE_DB: cinema
      CLICKHOUSE_USER: app
      CLICKHOUSE_PASSWORD: app
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user app --password app --query 'SELECT count() FROM cinema.movie_events' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  # ------------------------------------------------------------------ PostgreSQL (готовые метрики)
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d analytics"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  flyway:
    image: flyway/flyway:10
    depends_on:
      postgres: {condition: service_healthy}
    command: -url=jdbc:postgresql://postgres:5432/analytics -user=app -password=app -connectRetries=30 migrate
    volumes:
      - ./postgres/migrations:/flyway/sql:ro
    restart: "no"

  # ------------------------------------------------------------------ S3 (SeaweedFS — S3-совместимое хранилище, аналог MinIO)
  s3:
    image: chrislusf/seaweedfs:3.80
    command: "server -ip=s3 -ip.bind=0.0.0.0 -dir=/data -s3 -s3.port=8333 -master.volumeSizeLimitMB=64 -volume.max=20"
    ports: ["8333:8333", "8888:8888"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8888/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # ------------------------------------------------------------------ Aggregation Service
  aggregation-service:
    build: ./aggregator
    depends_on:
      clickhouse: {condition: service_healthy}
      flyway: {condition: service_completed_successfully}
      s3: {condition: service_healthy}
    ports: ["8001:8001"]
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: app
      CLICKHOUSE_PASSWORD: app
      POSTGRES_DSN: postgresql://app:app@postgres:5432/analytics
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: movie-analytics
      AGGREGATION_INTERVAL_SECONDS: "60"
      RECOMPUTE_DAYS: "8"
      EXPORT_INTERVAL_SECONDS: "300"
    healthcheck:
      <<: *py-health
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health', timeout=3).status == 200 else 1)"]
    restart: unless-stopped

  # ------------------------------------------------------------------ Grafana
  grafana:
    image: grafana/grafana:11.3.0
    depends_on:
      clickhouse: {condition: service_healthy}
    ports: ["3000:3000"]
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cinema.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # ------------------------------------------------------------------ Интеграционные тесты (docker compose run --rm tests)
  tests:
    build: ./tests
    profiles: ["test"]
    depends_on:
      movie-service: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      aggregation-service: {condition: service_healthy}
    environment:
      PRODUCER_URL: http://movie-service:8000
      AGGREGATOR_URL: http://aggregation-service:8001
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: app
      CLICKHOUSE_PASSWORD: app
      POSTGRES_DSN: postgresql://app:app@postgres:5432/analytics
      S3_ENDPOINT: http://s3:8333
